<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Acta icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6d5cf6"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.3" cy="0.05" r="0.9">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="aShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0c2461" flood-opacity="0.38"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#topGlow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#vignette)"/>

    <!-- faint markdown log lines -->
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="14" stroke-linecap="round">
      <path d="M180 236 H420"/>
      <path d="M180 316 H360"/>
      <path d="M664 736 H844"/>
      <path d="M604 816 H844"/>
    </g>
  </g>

  <!-- rounded-stroke A -->
  <g filter="url(#aShadow)" fill="none" stroke="#ffffff" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 764 L512 288 L702 764"/>
  </g>
  <rect x="393" y="586" width="238" height="86" rx="43" fill="#a5f3fc"/>
  <rect x="393" y="586" width="238" height="86" rx="43" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4"/>
</svg>
